# Render Blueprint: ONE free web service. It runs the API, the worker and a small embedded Redis in the same container
# (START_EMBEDDED_REDIS + RUN_WORKER), plus a free Postgres database. Render allows only one free Key Value instance per
# workspace, so this avoids needing one. See docs/DEPLOY.md for what that costs and when to switch to a real Redis.
services:
  - type: web
    name: notification-service
    runtime: docker
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notification-db
          property: connectionString
      - key: START_EMBEDDED_REDIS
        value: "true"
      - key: REDIS_URL
        value: redis://127.0.0.1:6379
      - key: STREAM_TOKEN_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: RUN_WORKER
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "10"
      - key: EMAIL_PROVIDER
        value: mock
      # Only needed with EMAIL_PROVIDER=resend. Render asks for these once, when the Blueprint is first created.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: notification-db
    plan: free
    databaseName: notifications
    user: notifications
