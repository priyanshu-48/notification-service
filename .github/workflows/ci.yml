name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: notifications
          POSTGRES_DB: notifications
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notifications -d notifications"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://notifications:notifications@localhost:5432/notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm run sdk:build
      - run: npm test
